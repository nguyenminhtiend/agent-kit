# agent-kit settings for this project.
# Only the agent-kit runner reads this file. Claude Code and Codex do not.

[paths]
# Folder for brief/, docs/, tasks/ and .workflow/, relative to this file. "." = here.
# Existing project: use a new folder (e.g. "specs") so nothing mixes with your own
# docs/ or tasks/. One folder per feature: agent-kit --workspace specs/<feature> ...
workspace = "."

[models]
# Claude model for each stage (an alias like "opus" or a full model ID).
spec = "opus"
review = "opus"
plan = "opus"

[limits]
# Positive integer: most agent turns one Claude call may take.
max_turns = 30
# Nonnegative number: most dollars one Claude call may spend. 0 = no limit.
max_budget_usd = 0

[review]
# Reviewer agents. 'agent-kit review' runs them in parallel.
agents = ["product-reviewer", "architecture-reviewer", "qa-reviewer"]
# Findings with these severities make 'agent-kit review' exit 2 (run 'agent-kit repair').
block_on = ["critical", "major"]
